# config.yaml — Configuración de la máquina expendedora cripto (vending-solana)
# Los valores aquí definidos pueden sobrescribirse con variables de entorno
# (ver .env.example). Preferencia: env > config.yaml > defaults.

network: mainnet-beta

# RPC público de mainnet (sin Helius). El respaldo puede ser el mismo endpoint
# o un proveedor público alternativo.
rpc_http: "https://api.mainnet-beta.solana.com"
rpc_ws: "wss://api.mainnet-beta.solana.com"
rpc_http_backup: "https://api.mainnet-beta.solana.com"

# USDC mainnet real (6 decimales).
usdc_mint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
usdc_decimals: 6

# Wallet del comercio (keypair nuevo; NUNCA en git).
wallet_path: "wallet.json"

# Timeouts / duración
order_timeout_seconds: 60
dispense_pulse_seconds: 2.5
poll_interval_ms: 1500

# Pines GPIO (BCM). En esta Pi 5 con RP1 el header de 40 pines es
# /dev/gpiochip15 (se puede sobrescribir con GPIO_CHIP). Otras Pi pueden
# usar gpiochip0 o gpiochip4.
gpio_chip: 15
dispense_pin: 17
led_ready_pin: 27
led_paid_pin: 22
led_error_pin: 23

# Modo de prueba del dispensador: si "auto", usa GPIO real cuando esté
# disponible; si "stub", nunca toca GPIO (host de desarrollo).
dispenser_mode: auto

# Devolución automática de USDC tras detectar el pago.
# Requiere que wallet.json tenga la CLAVE PRIVADA del comercio (firmante).
# refund_to: wallet destino (p.ej. la Phantom del teléfono).
auto_refund_enabled: false
refund_delay_seconds: 30
refund_to: ""